project:
  type: book
  output-dir: docs
  post-render:
    - scripts/post-render-figures.R
  resources:
    - .nojekyll
    - figures/

book:
  title: "<span style='font-weight: 700'>Análisis de Encuestas de Hogares</span><br/><i style='color: #00b7ff'>usando R</i>"
  subtitle: "Análisis de Encuestas de Hogares usando R"
  author: "Andrés Gutiérrez, Stalyn Guerrero, Giovany Babativa y Cristian Téllez"
  search: true
  page-navigation: true
  sidebar:
    style: floating
    collapse-level: 1
  date: today
  date-format: long
  chapters:
    - index.qmd
    - chapters/01-Introduccion.qmd
    - chapters/02-Conceptos.qmd
    - chapters/03-Continuas.qmd
    - chapters/04-Categoricas.qmd
    - chapters/05-Regresion.qmd
    - chapters/06-GLM.qmd
    - chapters/07-Multinivel.qmd
    - part: "Anexos"
      chapters:
        - chapters/A1-TidyVerse.qmd
        - chapters/A2-MPVbinder.qmd
    - chapters/references.qmd
  page-footer: "Análisis de encuestas de hogares usando R"

bibliography: references.bib
lang: es

crossref:
  chapters: true
  eq-prefix: ecuación
  fig-prefix: figura
  tbl-prefix: tabla

format:
  html:
    theme: cosmo
    css: styles.css
    include-in-header: scripts/mathjax-macros.html
    include-after-body: scripts/number-callouts.html
    toc: true
    toc-depth: 3
    toc-location: right
    smooth-scroll: true
    number-sections: true
    code-fold: false

execute:
  echo: true
  warning: false
  message: false
  freeze: auto
